<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 575" width="100%" font-family="'Source Sans 3', 'Inter', sans-serif" role="img"><defs><marker id="f3-mb" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#900C3F"/></marker><marker id="f3-mu" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F3A5F"/></marker><marker id="f3-ma" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E2E33"/></marker><marker id="f3-mg" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b6b73"/></marker><marker id="f3-mv" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6b4f"/></marker><marker id="f3-mo" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b07d00"/></marker></defs><rect x="10.0" y="10.0" width="230.0" height="108.0" rx="6" fill="#e3ebf5" stroke="#1F3A5F" stroke-width="1.2" opacity="1"/><text x="125.0" y="30.0" font-size="12.5" font-weight="700" fill="#1F3A5F" text-anchor="middle"><tspan x="125.0" dy="0.0">SEGNALE 1 · innesco</tspan></text><text x="125.0" y="50.0" font-size="11" font-weight="400" fill="#2E2E33" text-anchor="middle"><tspan x="125.0" dy="0.0">PAMP/DAMP → TLR · TNF · IL-1</tspan><tspan x="125.0" dy="13.4">→ NF-κB</tspan><tspan x="125.0" dy="13.4">↑ trascrizione di NLRP3</tspan><tspan x="125.0" dy="13.4">e di pro-IL-1β, pro-IL-18</tspan></text><rect x="260.0" y="10.0" width="230.0" height="108.0" rx="6" fill="#f6e1ea" stroke="#900C3F" stroke-width="1.2" opacity="1"/><text x="375.0" y="30.0" font-size="12.5" font-weight="700" fill="#900C3F" tex