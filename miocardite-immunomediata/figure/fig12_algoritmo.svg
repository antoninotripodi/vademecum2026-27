<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 770" width="100%" font-family="'Source Sans 3', 'Inter', sans-serif" role="img"><defs><marker id="f12-mb" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#900C3F"/></marker><marker id="f12-mu" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F3A5F"/></marker><marker id="f12-ma" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E2E33"/></marker><marker id="f12-mg" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b6b73"/></marker><marker id="f12-mv" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6b4f"/></marker><marker id="f12-mo" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b07d00"/></marker></defs><rect x="300.0" y="8.0" width="400.0" height="54.0" rx="6" fill="#2E2E33" stroke="#2E2E33" stroke-width="1.2" opacity="1"/><text x="500.0" y="30.6" font-size="12.5" font-weight="400" fill="#fff" text-anchor="middle"><tspan x="500.0" dy="0.0"><tspan font-weight="700">SOSPETTA MIOCARDITE</tspan></tspan><tspan x="500.0" dy="15.0">dolore toracico · scompenso/shock · aritmie, sincope</tspan></text><text x="500.0" y="80.0" font-size="11" font-weight="400" fill="#6b6b73" text-anchor="middle" font-style="italic"><tspan x="500.0" dy="0.0">contesto: prodromi virali, farmaci, vaccini, ICI, malattie autoimmuni, familiarità</tspan></text><path d="M500.0,86.0 L500.0,104.0" fill="none" stroke="#2E2E33" stroke-width="2" marker-end="url(#f12-ma)"/><path d="M500,106 L640,140 L500,174 L360,140 Z" fill="#fff" stroke="#2E2E33" stroke-width="1.6" opacity="1" stroke-linejoin="round" stroke-linecap="round" /><text x="500.0" y="136.0" font-size="11.5" font-weight="700" fill="#2E2E33" text-anchor="middle"><tspan x="500.0" dy="0.0">1 · Stabilità emodinamica</tspan><tspan x="500.0" dy="13.2">ed elettrica?</tspan></text><path d="M360.0,140.0 L200.0,140.0" fill="none" stroke="#900C3F" stroke-width="2" marker-end="url(#f12-mb)"/><path d="M200.0,140.0 L200.0,196.0" fill="none" stroke="#900C3F" stroke-width="2" marker-end="url(#f12-mb)"/><text x="270.0" y="132.0" font-size="12" font-weight="700" fill="#900C3F" text-anchor="middle"><tspan x="270.0" dy="0.0">NO</tspan></text><path d="M640.0,140.0 L760.0,140.0" fill="none" stroke="#1F3A5F" stroke-width="2" marker-end="url(#f12-mu)"/><path d="M760.0,140.0 L760.0,196.0" fill="none" stroke="#1F3A5F" stroke-width="2" marker-end="url(#f12-mu)"/><text x="700.0" y="132.0" font-size="12" font-weight="700" fill="#1F3A5F" text-anchor="middle"><tspan x="700.0" dy="0.0">SÌ</tspan></text><rect x="20.0" y="190.0" width="360.0" height="430.0" rx="10" fill="#fdf3f6" stroke="#d98aa8" stroke-width="1" opacity="1"/><text x="200.0" y="214.0" font-size="12" font-weight="700" fill="#900C3F" text-anchor="middle" letter-spacing="0.5"><tspan x="200.0" dy="0.0">ALTO RISCHIO · STADIO D (ACC)</tspan></text><text x="200.0" y="230.0" font-size="10.5" font-weight="400" fill="#900C3F" text-anchor="middle" font-style="italic"><tspan x="200.0" dy="0.0">shock, bassa portata, TV sostenuta, BAV avanzato</tspan></text><rect x="40.0" y="244.0" width="320.0" height="46.0" rx="6" fill="#fff" stroke="#900C3F" stroke-width="1.2" opacity="1"/><text x="200.0" y="263.1" font-size="11.2" font-weight="400" fill="#2E2E33" text-anchor="middle"><tspan x="200.0" dy="0.0"><tspan font-weight="700">Stabilizzazione</tspan>: inotropi/vasopressori,</tspan><tspan x="200.0" dy="13.4">cardioversione, pacing temporaneo</tspan></text><path d="M200.0,292.0 L200.0,314.0" fill="none" stroke="#900C3F" stroke-width="1.6" marker-end="url(#f12-mb)"/><rect x="40.0" y="316.0" width="320.0" height="46.0" rx="6" fill="#fff" stroke="#900C3F" stroke-width="1.2" opacity="1"/><text x="200.0" y="335.1" font-size="11.2" font-weight="400" fill="#2E2E33" text-anchor="middle"><tspan x="200.0" dy="0.0"><tspan font-weight="700">Centro hub</tspan>: supporto circolatorio meccanico</tspan><tspan x="200.0" dy="13.4">(Impella, VA-ECMO), terapia intensiva</tspan></text><path d="M200.0,364.0 L200.0,386.0" fill="none" stroke="#900C3F" stroke-width="1.6" marker-end="url(#f12-mb)"/><rect x="40.0" y="388.0" width="320.0" height="46.0" rx="6" fill="#fff" stroke="#900C3F" stroke-width="1.2" opacity="1"/><text x="200.0" y="407.1" font-size="11.2" font-weight="400" fill="#2E2E33" text-anchor="middle"><tspan x="200.0" dy="0.0"><tspan font-weight="700">Coronarografia + BEM precoce</tspan></tspan><tspan x="200.0" dy="13.4">(istologia, immunoistochimica, PCR virale)</tspan></text><path d="M200.0,436.0 L200.0,458.0" fill="none" stroke="#900C3F" stroke-width="1.6" marker-end="url(#f12-mb)"/><rect x="40.0" y="460.0" width="320.0" height="46.0" rx="6" fill="#fff" stroke="#900C3F" stroke-width="1.2" opacity="1"/><text x="200.0" y="479.1" font-size="11.2" font-weight="400" fill="#2E2E33" text-anchor="middle"><tspan x="200.0" dy="0.0"><tspan font-weight="700">Istotipo</tspan> → GCM · eosinofila · linfocitaria</tspan><tspan x="200.0" dy="13.4">(virus ±) · ICI · sarcoidosi</tspan></text><path d="M200.0,508.0 L200.0,530.0" fill="none" stroke="#900C3F" stroke-width="1.6" marker-end="url(#f12-mb)"/><rect x="40.0" y="532.0" width="320.0" height="46.0" rx="6" fill="#fff" stroke="#900C3F" stroke-width="1.2" opacity="1"/><text x="200.0" y="551.1" font-size="11.2" font-weight="400" fill="#2E2E33" text-anchor="middle"><tspan x="200.0" dy="0.0"><tspan font-weight="700">Terapia eziologica</tspan> + supporto</tspan><tspan x="200.0" dy="13.4">→ ponte al recupero, alla decisione o al trapianto</tspan></text><text x="200.0" y="608.0" font-size="10.5" font-weight="400" fill="#900C3F" text-anchor="middle" font-style="italic"><tspan x="200.0" dy="0.0">CMR appena le condizioni lo consentono</tspan></text><rect x="400.0" y="190.0" width="580.0" height="430.0" rx="10" fill="#f3f6fb" stroke="#7f9cc0" stroke-width="1" opacity="1"/><text x="690.0" y="214.0" font-size="12" font-weight="700" fill="#1F3A5F" text-anchor="middle" letter-spacing="0.5"><tspan x="690.0" dy="0.0">PAZIENTE STABILE</tspan></text><rect x="420.0" y="230.0" width="540.0" height="46.0" rx="6" fill="#fff" stroke="#1F3A5F" stroke-width="1.2" opacity="1"/><text x="690.0" y="249.1" font-size="11.2" font-weight="400" fill="#2E2E33" text-anchor="middle"><tspan x="690.0" dy="0.0"><tspan font-weight="700">2–5 · Anamnesi, esame obiettivo, ECG, biomarcatori, ecocardiogramma</tspan></tspan><tspan x="690.0" dy="13.4">hs-cTn (dinamica), NT-proBNP, PCR, emocromo (eosinofili), CK; FEVS, GLS, versamento</tspan></text><path d="M690.0,278.0 L690.0,300.0" fill="none" stroke="#1F3A5F" stroke-width="1.6" marker-end="url(#f12-mu)"/><rect x="420.0" y="302.0" width="540.0" height="46.0" rx="6" fill="#fff" stroke="#1F3A5F" stroke-width="1.2" opacity="1"/><text x="690.0" y="321.1" font-size="11.2" font-weight="400" fill="#2E2E33" text-anchor="middle"><tspan x="690.0" dy="0.0"><tspan font-weight="700">6 · Escludere la sindrome coronarica acuta</tspan></tspan><tspan x="690.0" dy="13.4">coronarografia (STEMI-like, rischio alto) · TC coronarica (rischio basso-intermedio)</tspan></text><path d="M690.0,350.0 L690.0,372.0" fill="none" stroke="#1F3A5F" stroke-width="1.6" marker-end="url(#f12-mu)"/><rect x="420.0" y="374.0" width="540.0" height="46.0" rx="6" fill="#fff" stroke="#1F3A5F" stroke-width="1.2" opacity="1"/><text x="690.0" y="393.1" font-size="11.2" font-weight="400" fill="#2E2E33" text-anchor="middle"><tspan x="690.0" dy="0.0"><tspan font-weight="700">7 · CMR (Lake Louise 2018)</tspan>: ≥1 criterio T2 + ≥1 criterio T1 → miocardite definita</tspan><tspan x="690.0" dy="13.4">negativa o dubbia → rivalutare timing e diagnosi alternative (Takotsubo, genetica…)</tspan></text><path d="M690.0,422.0 L690.0,444.0" fill="none" stroke="#1F3A5F" stroke-width="1.6" marker-end="url(#f12-mu)"/><rect x="420.0" y="446.0" width="540.0" height="46.0" rx="6" fill="#fff" stroke="#1F3A5F" stroke-width="1.2" opacity="1"/><text x="690.0" y="465.1" font-size="11.2" font-weight="400" fill="#2E2E33" text-anchor="middle"><tspan x="690.0" dy="0.0"><tspan font-weight="700">8 · BEM</tspan> se rischio alto, mancata risposta, sospetto di forme specifiche,</tspan><tspan x="690.0" dy="13.4">BAV/TV con disfunzione, prima di un'immunosoppressione</tspan></text><path d="M690.0,494.0 L690.0,516.0" fill="none" stroke="#1F3A5F" stroke-width="1.6" marker-end="url(#f12-mu)"/><rect x="420.0" y="518.0" width="540.0" height="46.0" rx="6" fill="#fff" stroke="#1F3A5F" stroke-width="1.2" opacity="1"/><text x="690.0" y="537.1" font-size="11.2" font-weight="400" fill="#2E2E33" text-anchor="middle"><tspan x="690.0" dy="0.0"><tspan font-weight="700">9 · Stratificazione del rischio</tspan>: FEVS, aritmie, estensione e sede dell'LGE</tspan><tspan x="690.0" dy="13.4"><tspan font-weight="700">10 · Eziologia</tspan>: virale attiva, post-infettiva/autoimmune, ICI, eosinofila, GCM, genetica</tspan></text><path d="M690.0,566.0 L690.0,640.0" fill="none" stroke="#1F3A5F" stroke-width="1.6" marker-end="url(#f12-mu)"/><path d="M200.0,620.0 L200.0,640.0" fill="none" stroke="#900C3F" stroke-width="1.6" marker-end="url(#f12-mb)"/><text x="500.0" y="660.0" font-size="12" font-weight="700" fill="#2E2E33" text-anchor="middle" letter-spacing="0.6"><tspan x="500.0" dy="0.0">TERAPIA GUIDATA DAL MECCANISMO</tspan></text><rect x="10.0" y="668.0" width="192.0" height="46.0" rx="6" fill="#eeeef0" stroke="#2E2E33" stroke-width="1.2" opacity="1"/><text x="106.0" y="687.9" font-size="10.3" font-weight="700" fill="#2E2E33" text-anchor="middle"><tspan x="106.0" dy="0.0">Tutti</tspan></text><text x="106.0" y="699.8" font-size="10.3" font-weight="400" fill="#2E2E33" text-anchor="middle"><tspan x="106.0" dy="0.0">scompenso, aritmie, restrizione attività</tspan></text><rect x="208.0" y="668.0" width="192.0" height="46.0" rx="6" fill="#fff" stroke="#900C3F" stroke-width="1.2" opacity="1"/><text x="304.0" y="687.9" font-size="10.3" font-weight="700" fill="#900C3F" text-anchor="middle"><tspan x="304.0" dy="0.0">Virale attiva</tspan></text><text x="304.0" y="699.8" font-size="10.3" font-weight="400" fill="#2E2E33" text-anchor="middle"><tspan x="304.0" dy="0.0">supporto; evitare immunosoppressione</tspan></text><rect x="406.0" y="668.0" width="192.0" height="46.0" rx="6" fill="#fff" stroke="#1F3A5F" stroke-width="1.2" opacity="1"/><text x="502.0" y="687.9" font-size="10.3" font-weight="700" fill="#1F3A5F" text-anchor="middle"><tspan x="502.0" dy="0.0">Virus-negativa progressiva</tspan></text><text x="502.0" y="699.8" font-size="10.3" font-weight="400" fill="#2E2E33" text-anchor="middle"><tspan x="502.0" dy="0.0">considerare prednisone + azatioprina</tspan></text><rect x="604.0" y="668.0" width="192.0" height="46.0" rx="6" fill="#fff" stroke="#1F3A5F" stroke-width="1.2" opacity="1"/><text x="700.0" y="687.9" font-size="10.3" font-weight="700" fill="#1F3A5F" text-anchor="middle"><tspan x="700.0" dy="0.0">ICI</tspan></text><text x="700.0" y="699.8" font-size="10.3" font-weight="400" fill="#2E2E33" text-anchor="middle"><tspan x="700.0" dy="0.0">stop ICI + metilprednisolone; abatacept</tspan></text><rect x="802.0" y="668.0" width="192.0" height="46.0" rx="6" fill="#fff" stroke="#1F3A5F" stroke-width="1.2" opacity="1"/><text x="898.0" y="687.9" font-size="10.3" font-weight="700" fill="#1F3A5F" text-anchor="middle"><tspan x="898.0" dy="0.0">Eosinofila / GCM</tspan></text><text x="898.0" y="699.8" font-size="10.3" font-weight="400" fill="#2E2E33" text-anchor="middle"><tspan x="898.0" dy="0.0">corticosteroidi / IS combinata</tspan></text><text x="500.0" y="734.0" font-size="1" font-weight="400" fill="#2E2E33" text-anchor="start"><tspan x="500.0" dy="0.0"></tspan></text><rect x="10" y="724" width="980" height="40" rx="6" fill="#e2f0e8" stroke="#2f6b4f"/><text x="500" y="740" font-size="11.3" text-anchor="middle" fill="#2E2E33"><tspan font-weight="700" fill="#2f6b4f">FOLLOW-UP</tspan> · restrizione dell'esercizio personalizzata · ECG, Holter, ecocardiogramma, biomarcatori · <tspan font-weight="700">CMR entro 6 mesi</tspan></text><text x="500" y="756" font-size="11.3" text-anchor="middle" fill="#2E2E33">defibrillatore indossabile come ponte · decisione sull'ICD a 3–6 mesi · test genetici se forme ricorrenti o familiari</text></svg>