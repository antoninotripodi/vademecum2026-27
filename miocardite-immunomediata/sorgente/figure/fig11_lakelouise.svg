.0"><tspan font-weight="700">T2 mapping</tspan>: aumento</tspan><tspan x="125.0" dy="13.2">regionale o globale del T2</tspan></text><rect x="10.0" y="110.0" width="230.0" height="66.0" rx="6" fill="#e3ebf5" stroke="#1F3A5F" stroke-width="1.2" opacity="1"/><text x="125.0" y="132.6" font-size="11" font-weight="400" fill="#2E2E33" text-anchor="middle"><tspan x="125.0" dy="0.0"><tspan font-weight="700">Immagini T2-pesate</tspan>: iperintensità</tspan><tspan x="125.0" dy="13.2">regionale o globale (es. rapporto</tspan><tspan x="125.0" dy="13.2">miocardio/muscolo scheletrico ≥2)</tspan></text><rect x="260.0" y="50.0" width="230.0" height="38.0" rx="6" fill="#f6e1ea" stroke="#900C3F" stroke-width="1.2" opacity="1"/><text x="375.0" y="71.8" font-size="11" font-weight="400" fill="#2E2E33" text-anchor="middle"><tspan x="375.0" dy="0.0"><tspan font-weight="700">T1 nativo</tspan> aumentato</tspan></text><rect x="260.0" y="94.0" width="230.0" height="38.0" rx="6" fill="#f6e1ea" stroke="#900C3F" stroke-width="1.2" opacity="1"/><text x="375.0" y="115.8" font-size="11" font-weight="400" fill="#2E2E33" text-anchor="middle"><tspan x="375.0" dy="0.0"><tspan font-weight="700">ECV</tspan> aumentato</tspan></text><rect x="260.0" y="138.0" width="230.0" height="38.0" rx="6" fill="#f6e1ea" stroke="#900C3F" stroke-width="1.2" opacity="1"/><text x="375.0" y="159.8" font-size="11" font-weight="400" fill="#2E2E33" text-anchor="middle"><tspan x="375.0" dy="0.0"><tspan font-weight="700">LGE</tspan> a distribuzione non ischemica</tspan></text><text x="125.0" y="194.0" font-size="11.5" font-weight="700" fill="#1F3A5F" text-anchor="middle"><tspan x="125.0" dy="0.0">almeno 1</tspan></text><text x="375.0" y="194.0" font-size="11.5" font-weight="700" fill="#900C3F" text-anchor="middle"><tspan x="375.0" dy="0.0">almeno 1</tspan></text><path d="M125.0,200.0 L225.0,226.0" fill="none" stroke="#1F3A5F" stroke-width="2" marker-end="url(#f11-mu)"/><path d="M375.0,200.0 L275.0,226.0" fill="none" stroke="#900C