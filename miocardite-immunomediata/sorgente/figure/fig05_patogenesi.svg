<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 544" width="100%" font-family="'Source Sans 3', 'Inter', sans-serif" role="img"><defs><marker id="f5-mb" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#900C3F"/></marker><marker id="f5-mu" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F3A5F"/></marker><marker id="f5-ma" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E2E33"/></marker><marker id="f5-mg" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b6b73"/></marker><marker id="f5-mv" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6b4f"/></marker><marker id="f5-mo" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b07d00"/></marker></defs><rect x="10.0" y="8.0" width="310.0" height="30.0" rx="5" fill="#900C3F" stroke="none" stroke-width="1" opacity="1"/><text x="165.0" y="28.0" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" letter-spacing="0.4"><tspan x="165.0" dy="0.0">FASE 1 · DANNO E IMMUNITÀ INNATA</tspan></text><text x="165.0" y="54.0" font-size="11" font-weight="600" fill="#900C3F" text-anchor="middle" font-style="italic"><tspan x="165.0" dy="0.0">giorni</tspan></text><rect x="345.0" y="8.0" width="310.0" height="30.0" rx="5" fill="#1F3A5F" stroke="none" stroke-width="1" opacity="1"/><text x="500.0" y="28.0" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" letter-spacing="0.4"><tspan x="500.0" dy="0.0">FASE 2 · RISPOSTA ADATTATIVA E AUTOIMMUNITÀ</tspan></text><text x="500.0" y="54.0" font-size="11" font-weight="600" fill="#1F3A5F" text-anchor="middle" font-style="italic"><tspan x="500.0" dy="0.0">settimane</tspan></text><rect x="680.0" y="8.0" width="310.0" height="30.0" rx="5" fill="#2f6b4f" stroke="none" stroke-width="1" opacity="1"/><text x="835.0" y="28.0" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" letter-spacing="0.4"><tspan x="835.0" dy="0.0">FASE 3 · RISOLUZIONE O CRONICIZZAZIONE</tspan></text><text x="835.0" y="54.0" font-size="11" font-weight="600" fill="#2f6b4f" text-anchor="middle" font-style="italic"><tspan x="835.0" dy="0.0">mesi</tspan></text><rect x="10.0" y="64.0" width="310.0" height="46.0" rx="6" fill="#fdf3f6" stroke="#900C3F" stroke-width="1.2" opacity="1"/><text x="165.0" y="82.8" font-size="11.3" font-weight="400" fill="#2E2E33" text-anchor="middle"><tspan x="165.0" dy="0.0"><tspan font-weight="700">Trigger</tspan>: virus cardiotropo (CVB3 → CAR/CD55;</tspan><tspan x="165.0" dy="13.8">proteasi 2A taglia la distrofina), farmaco, ICI</tspan></text><rect x="10.0" y="132.0" width="310.0" height="46.0" rx="6" fill="#fdf3f6" stroke="#900C3F" stroke-width="1.2" opacity="1"/><text x="165.0" y="150.8" font-size="11.3" font-weight="400" fill="#2E2E33" text-anchor="middle"><tspan x="165.0" dy="0.0"><tspan font-weight="700">Danno del cardiomiocita</tspan>: citolisi, necrosi</tspan><tspan x="165.0" dy="13.8">→ rilascio di DAMP (HMGB1, ATP, DNA mt)</tspan></text><rect x="10.0" y="200.0" width="310.0" height="46.0" rx="6" fill="#fdf3f6" stroke="#900C3F" stroke-width="1.2" opacity="1"/><text x="165.0" y="218.8" font-size="11.3" font-weight="400" fill="#2E2E33" text-anchor="middle"><tspan x="165.0" dy="0.0"><tspan font-weight="700">Riconoscimento</tspan>: TLR3/7/8, RIG-I/MDA5, NLRP3</tspan><tspan x="165.0" dy="13.8">→ NF-κB, IRF3/7, caspasi-1</tspan></text><rect x="10.0" y="268.0" width="310.0" height="46.0" rx="6" fill="#fdf3f6" stroke="#900C3F" stroke-width="1.2" opacity="1"/><text x="165.0" y="286.8" font-size="11.3" font-weight="400" fill="#2E2E33" text-anchor="middle"><tspan x="165.0" dy="0.0"><tspan font-weight="700">Mediatori</tspan>: IFN-α/β (antivirale) · TNF-α, IL-1β,</tspan><tspan x="165.0" dy="13.8">IL-6 · chemochine CCL2, CXCL1/8, CXCL10</tspan></text><rect x="10.0" y="336.0" width="310.0" height="46.0" rx="6" fill="#fdf3f6" stroke="#900C3F" stroke-width="1.2" opacity="1"/><text x="165.0" y="354.8" font-size="11.3" font-weight="400" fill="#2E2E33" text-anchor="middle"><tspan x="165.0" dy="0.0"><tspan font-weight="700">Infiltrato innato</tspan>: monociti CCR2⁺, neutrofili, NK</tspan><tspan x="165.0" dy="13.8">edema interstiziale (↑T2) · troponina ↑</tspan></text><path d="M165.0,112.0 L165.0,130.0" fill="none" stroke="#900C3F" stroke-width="1.6" marker-end="url(#f5-mb)"/><path d="M165.0,180.0 L165.0,198.0" fill="none" stroke="#900C3F" stroke-width="1.6" marker-end="url(#f5-mb)"/><path d="M165.0,248.0 L165.0,266.0" fill="none" stroke="#900C3F" stroke-width="1.6" marker-end="url(#f5-mb)"/><path d="M165.0,316.0 L165.0,334.0" fill="none" stroke="#900C3F" stroke-width="1.6" marker-end="url(#f5-mb)"/><rect x="345.0" y="64.0" width="310.0" height="46.0" rx="6" fill="#f3f6fb" stroke="#1F3A5F" stroke-width="1.2" opacity="1"/><text x="500.0" y="82.8" font-size="11.3" font-weight="400" fill="#2E2E33" text-anchor="middle"><tspan x="500.0" dy="0.0"><tspan font-weight="700">Cellule dendritiche</tspan> trasportano antigeni virali</tspan><tspan x="500.0" dy="13.8">e cardiaci al linfonodo (CCR7)</tspan></text><rect x="345.0" y="132.0" width="310.0" height="46.0" rx="6" fill="#f3f6fb" stroke="#1F3A5F" stroke-width="1.2" opacity="1"/><text x="500.0" y="150.8" font-size="11.3" font-weight="400" fill="#2E2E33" text-anchor="middle"><tspan x="500.0" dy="0.0"><tspan font-weight="700">Attivazione T</tspan>: TCR + CD28–CD80/86 + IL-12,</tspan><tspan x="500.0" dy="13.8">IL-6, IL-23 → espansione clonale</tspan></text><rect x="345.0" y="200.0" width="310.0" height="46.0" rx="6" fill="#f3f6fb" stroke="#1F3A5F" stroke-width="1.2" opacity="1"/><text x="500.0" y="218.8" font-size="11.3" font-weight="400" fill="#2E2E33" text-anchor="middle"><tspan x="500.0" dy="0.0"><tspan font-weight="700">Effettori</tspan>: Th1 (IFN-γ), Th17 (IL-17A, GM-CSF),</tspan><tspan x="500.0" dy="13.8">CD8⁺ (perforina, granzimi, FasL); Treg insufficienti</tspan></text><rect x="345.0" y="268.0" width="310.0" height="46.0" rx="6" fill="#f3f6fb" stroke="#1F3A5F" stroke-width="1.2" opacity="1"/><text x="500.0" y="286.8" font-size="11.3" font-weight="400" fill="#2E2E33" text-anchor="middle"><tspan x="500.0" dy="0.0"><tspan font-weight="700">Perdita della tolleranza</tspan>: mimetismo molecolare,</tspan><tspan x="500.0" dy="13.8">attivazione bystander, antigeni criptici, epitope spreading</tspan></text><rect x="345.0" y="336.0" width="310.0" height="46.0" rx="6" fill="#f3f6fb" stroke="#1F3A5F" stroke-width="1.2" opacity="1"/><text x="500.0" y="354.8" font-size="11.3" font-weight="400" fill="#2E2E33" text-anchor="middle"><tspan x="500.0" dy="0.0"><tspan font-weight="700">Autoanticorpi</tspan>: α-miosina, troponina I,</tspan><tspan x="500.0" dy="13.8">recettore β1-adrenergico, ANT</tspan></text><path d="M500.0,112.0 L500.0,130.0" fill="none" stroke="#1F3A5F" stroke-width="1.6" marker-end="url(#f5-mu)"/><path d="M500.0,180.0 L500.0,198.0" fill="none" stroke="#1F3A5F" stroke-width="1.6" marker-end="url(#f5-mu)"/><path d="M500.0,248.0 L500.0,266.0" fill="none" stroke="#1F3A5F" stroke-width="1.6" marker-end="url(#f5-mu)"/><path d="M500.0,316.0 L500.0,334.0" fill="none" stroke="#1F3A5F" stroke-width="1.6" marker-end="url(#f5-mu)"/><rect x="680.0" y="64.0" width="310.0" height="46.0" rx="6" fill="#f2f8f4" stroke="#2f6b4f" stroke-width="1.2" opacity="1"/><text x="835.0" y="83.0" font-size="11.3" font-weight="400" fill="#2E2E33" text-anchor="middle"><tspan x="835.0" dy="0.0"><tspan font-weight="700">Clearance del virus</tspan> (CD8⁺, NK, IFN)</tspan><tspan x="835.0" dy="13.6">e calo del segnale di pericolo</tspan></text><path d="M760.0,112.0 L760.0,136.0" fill="none" stroke="#2f6b4f" stroke-width="1.6" marker-end="url(#f5-mv)"/><path d="M910.0,112.0 L910.0,136.0" fill="none" stroke="#900C3F" stroke-width="1.6" marker-end="url(#f5-mb)"/><rect x="680.0" y="138.0" width="150.0" height="120.0" rx="6" fill="#f2f8f4" stroke="#2f6b4f" stroke-width="1.2" opacity="1"/><text x="755.0" y="167.8" font-size="11" font-weight="400" fill="#2E2E33" text-anchor="middle"><tspan x="755.0" dy="0.0"><tspan font-weight="700">Risoluzione</tspan></tspan><tspan x="755.0" dy="13.2">efferocitosi (MerTK)</tspan><tspan x="755.0" dy="13.2">macrofagi riparativi</tspan><tspan x="755.0" dy="13.2">IL-10, TGF-β, Treg</tspan><tspan x="755.0" dy="13.2">→ guarigione con</tspan><tspan x="755.0" dy="13.2">cicatrice minima</tspan></text><rect x="840.0" y="138.0" width="150.0" height="120.0" rx="6" fill="#fdf3f6" stroke="#900C3F" stroke-width="1.2" opacity="1"/><text x="915.0" y="167.8" font-size="11" font-weight="400" fill="#2E2E33" text-anchor="middle"><tspan x="915.0" dy="0.0"><tspan font-weight="700">Persistenza</tspan></tspan><tspan x="915.0" dy="13.2">necrosi → DAMP →</tspan><tspan x="915.0" dy="13.2">autoantigeni →</tspan><tspan x="915.0" dy="13.2">T effettori → nuova</tspan><tspan x="915.0" dy="13.2">necrosi (circuito</tspan><tspan x="915.0" dy="13.2">autoalimentato)</tspan></text><path d="M915.0,260.0 L915.0,284.0" fill="none" stroke="#900C3F" stroke-width="1.6" marker-end="url(#f5-mb)"/><rect x="680.0" y="286.0" width="310.0" height="64.0" rx="6" fill="#fdf3f6" stroke="#900C3F" stroke-width="1.2" opacity="1"/><text x="835.0" y="306.9" font-size="11.3" font-weight="400" fill="#2E2E33" text-anchor="middle"><tspan x="835.0" dy="0.0"><tspan font-weight="700">Fibrosi</tspan> (TGF-β → SMAD2/3, miofibroblasti)</tspan><tspan x="835.0" dy="13.8"><tspan font-weight="700">Rimodellamento</tspan> (Laplace, neuro-ormoni)</tspan><tspan x="835.0" dy="13.8">→ miocardiopatia infiammatoria cronica / DCM</tspan></text><path d="M835.0,352.0 L835.0,376.0" fill="none" stroke="#900C3F" stroke-width="1.6" marker-end="url(#f5-mb)"/><rect x="680.0" y="378.0" width="310.0" height="46.0" rx="6" fill="#fdf3f6" stroke="#900C3F" stroke-width="1.2" opacity="1"/><text x="835.0" y="397.0" font-size="11.3" font-weight="400" fill="#2E2E33" text-anchor="middle"><tspan x="835.0" dy="0.0"><tspan font-weight="700">Substrato aritmico</tspan>: cicatrice, conduzione lenta,</tspan><tspan x="835.0" dy="13.6">rientro → TV, morte improvvisa</tspan></text><rect x="680.0" y="446.0" width="310.0" height="46.0" rx="6" fill="#fff" stroke="#6b6b73" stroke-width="1.2" stroke-dasharray="4 3" opacity="1"/><text x="835.0" y="465.2" font-size="11" font-weight="400" fill="#2E2E33" text-anchor="middle"><tspan x="835.0" dy="0.0">Predittori nell'uomo: infiammazione IHC persistente,</tspan><tspan x="835.0" dy="13.2">LGE esteso, LGE senza edema a 6 mesi</tspan></text><path d="M322.0,150.0 L343.0,110.0" fill="none" stroke="#2E2E33" stroke-width="1.8" marker-end="url(#f5-ma)"/><path d="M657.0,240.0 Q672.0,170.0 678.0,100.0" fill="none" stroke="#2E2E33" stroke-width="1.8" marker-end="url(#f5-ma)"/><text x="10.0" y="520.0" font-size="10.5" font-weight="700" fill="#6b6b73" text-anchor="start"><tspan x="10.0" dy="0.0">Livello di evidenza:</tspan></text><rect x="112.0" y="509.0" width="34.4" height="15.0" rx="3" fill="#e3ebf5" stroke="#1F3A5F" stroke-width="0.8" opacity="1"/><text x="129.2" y="520.0" font-size="8.6" font-weight="700" fill="#1F3A5F" text-anchor="middle" letter-spacing="0.3"><tspan x="129.2" dy="0.0">UOMO</tspan></text><rect x="154.4" y="509.0" width="96.0" height="15.0" rx="3" fill="#fbf1d6" stroke="#b07d00" stroke-width="0.8" opacity="1"/><text x="202.4" y="520.0" font-size="8.6" font-weight="700" fill="#b07d00" text-anchor="middle" letter-spacing="0.3"><tspan x="202.4" dy="0.0">MODELLO ANIMALE</tspan></text><rect x="258.4" y="509.0" width="51.2" height="15.0" rx="3" fill="#ece6f6" stroke="#5b3c8f" stroke-width="0.8" opacity="1"/><text x="284.0" y="520.0" font-size="8.6" font-weight="700" fill="#5b3c8f" text-anchor="middle" letter-spacing="0.3"><tspan x="284.0" dy="0.0">IPOTESI</tspan></text><text x="370.0" y="520.0" font-size="10.3" font-weight="400" fill="#6b6b73" text-anchor="start" font-style="italic"><tspan x="370.0" dy="0.0">Uomo: infiltrati T e macrofagici, linfociti T anti-α-MyHC, valore prognostico di infiammazione e LGE.</tspan><tspan x="370.0" dy="13.4">Modello animale: sequenza a tre fasi, proteasi 2A–distrofina, ruolo di IL-17/GM-CSF. Ipotesi: contributo di epitopi virali mimetici.</tspan></text></svg>